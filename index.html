<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>幻球傳奇 / Mystic Ball Legends</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050913;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#game{position:fixed;inset:0}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.topbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(4,9,20,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);padding:10px 14px;border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.28)}
.title{font-size:12px;letter-spacing:.08em;opacity:.72;white-space:nowrap}
.score{font-weight:900;font-size:28px;min-width:110px;text-align:center}
button{pointer-events:auto;border:0;border-radius:13px;padding:10px 13px;font-weight:800;cursor:pointer}
#reset{background:#f4f7fb;color:#15213c}
#skill{background:linear-gradient(135deg,#ffd8e7,#ff9fc2);color:#4d2340;min-width:118px}
#skill:disabled{opacity:.45}
.skillCard{position:absolute;right:16px;bottom:18px;width:180px;background:rgba(4,9,20,.78);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:18px;padding:12px 14px}
.skillCard b{display:block;font-size:15px}
.skillCard small{display:block;opacity:.68;line-height:1.45;margin:5px 0 9px}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}
#bar{height:100%;width:100%;background:linear-gradient(90deg,#ff89b6,#ffe1ec)}
#message{position:absolute;left:50%;top:82px;transform:translateX(-50%);font-weight:900;font-size:18px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;opacity:.65;white-space:nowrap}
@media(max-width:680px){
 .topbar{top:8px;gap:8px;padding:8px 9px}.title{display:none}.score{font-size:22px;min-width:86px}
 button{padding:8px 10px}.skillCard{right:8px;bottom:44px;width:148px}.tip{bottom:8px;font-size:11px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="topbar">
    <div class="title">幻球傳奇 · Mystic Ball Legends</div>
    <button id="reset">重新開始</button>
    <div class="score"><span id="pScore">0</span> : <span id="aiScore">0</span></div>
    <button id="skill">皮皮熊技能</button>
  </div>
  <div id="message"></div>
  <div class="skillCard">
    <b>皮皮熊 · Pipi Bear</b>
    <small>正常 Q 版熊比例。技能啟動後點選我方半場，軀幹彈性伸長 5 秒幫忙反彈幻球。</small>
    <div class="bar"><div id="bar"></div></div>
  </div>
  <div class="tip">拖曳藍色推盤擊球 · 先得 5 分獲勝</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const host=document.getElementById('game');
const pScoreEl=document.getElementById('pScore');
const aiScoreEl=document.getElementById('aiScore');
const resetBtn=document.getElementById('reset');
const skillBtn=document.getElementById('skill');
const bar=document.getElementById('bar');
const message=document.getElementById('message');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050913);
scene.fog=new THREE.Fog(0x050913,16,34);

const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);
camera.position.set(0,13.6,15.5);
camera.lookAt(0,0,-1.2);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8fc8ff,0x11131b,1.4));
const key=new THREE.DirectionalLight(0xffffff,2.3);
key.position.set(-5,12,7);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-12;key.shadow.camera.right=12;key.shadow.camera.top=16;key.shadow.camera.bottom=-16;
scene.add(key);
const rim=new THREE.PointLight(0x3c88ff,40,28,2);rim.position.set(7,5,-2);scene.add(rim);
const pink=new THREE.PointLight(0xff6d9e,28,22,2);pink.position.set(-7,4,-8);scene.add(pink);

const TABLE_W=10, TABLE_H=15.5, HALF=TABLE_H/2, WALL=.28, GOAL_W=3.1;
const playY=.42;
const rink=new THREE.Group();scene.add(rink);

const baseMat=new THREE.MeshStandardMaterial({color:0x111b2d,metalness:.55,roughness:.3});
const base=new THREE.Mesh(new THREE.BoxGeometry(TABLE_W+1.3,.7,TABLE_H+1.3),baseMat);
base.position.y=0;base.castShadow=true;base.receiveShadow=true;rink.add(base);

const surfMat=new THREE.MeshPhysicalMaterial({color:0x153f6d,metalness:.5,roughness:.18,clearcoat:1,clearcoatRoughness:.12});
const surf=new THREE.Mesh(new THREE.BoxGeometry(TABLE_W,.18,TABLE_H),surfMat);
surf.position.y=.43;surf.receiveShadow=true;rink.add(surf);

const trimMat=new THREE.MeshStandardMaterial({color:0x8aa8c7,metalness:.9,roughness:.2});
const glowMat=new THREE.MeshStandardMaterial({color:0xa8ddff,emissive:0x197fc7,emissiveIntensity:2.6,metalness:.25,roughness:.22});
function addWall(x,z,w,d){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,.72,d),trimMat);
  m.position.set(x,.78,z);m.castShadow=true;rink.add(m);return m;
}
addWall(-TABLE_W/2-WALL/2,0,WALL,TABLE_H+WALL*2);
addWall(TABLE_W/2+WALL/2,0,WALL,TABLE_H+WALL*2);
const topSide=(TABLE_W-GOAL_W)/2;
addWall(-(GOAL_W/2+topSide/2),-HALF-WALL/2,topSide,WALL);
addWall((GOAL_W/2+topSide/2),-HALF-WALL/2,topSide,WALL);
addWall(-(GOAL_W/2+topSide/2),HALF+WALL/2,topSide,WALL);
addWall((GOAL_W/2+topSide/2),HALF+WALL/2,topSide,WALL);

function goal(z,color){
 const g=new THREE.Group();
 const back=new THREE.Mesh(new THREE.BoxGeometry(GOAL_W,.55,.36),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.5,metalness:.6,roughness:.25}));
 back.position.set(0,.75,z);
 const lip=new THREE.Mesh(new THREE.BoxGeometry(GOAL_W+0.5,.16,.9),trimMat);lip.position.set(0,.52,z+(z<0?-.25:.25));
 g.add(back,lip);rink.add(g);
}
goal(-HALF-.72,0xff536f);goal(HALF+.72,0x4aa7ff);

const lineMat=new THREE.MeshBasicMaterial({color:0xbfe7ff,transparent:true,opacity:.45});
const line=new THREE.Mesh(new THREE.BoxGeometry(TABLE_W-.5,.018,.035),lineMat);line.position.set(0,.54,0);rink.add(line);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.28,1.34,64),lineMat);ring.rotation.x=-Math.PI/2;ring.position.y=.56;rink.add(ring);

for(let i=-4;i<=4;i++){
 const strip=new THREE.Mesh(new THREE.BoxGeometry(.018,.012,TABLE_H-.8),new THREE.MeshBasicMaterial({color:0x63a9df,transparent:true,opacity:.08}));
 strip.position.set(i*1.05,.545,0);rink.add(strip);
}

const puck={x:0,z:0,vx:0,vz:5.7,r:.36};
const puckG=new THREE.Group();scene.add(puckG);
const puckBody=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.22,48),new THREE.MeshPhysicalMaterial({color:0xdff7ff,emissive:0x4aa8ff,emissiveIntensity:1.8,metalness:.7,roughness:.16,clearcoat:1}));
puckBody.castShadow=true;puckG.add(puckBody);
const puckRing=new THREE.Mesh(new THREE.TorusGeometry(.36,.045,12,48),new THREE.MeshBasicMaterial({color:0x89d8ff}));
puckRing.rotation.x=Math.PI/2;puckG.add(puckRing);

function makeMallet(color,emissive){
 const g=new THREE.Group();
 const lower=new THREE.Mesh(new THREE.CylinderGeometry(.7,.76,.24,48),new THREE.MeshStandardMaterial({color,metalness:.7,roughness:.22,emissive,emissiveIntensity:.55}));
 lower.castShadow=true;g.add(lower);
 const top=new THREE.Mesh(new THREE.CylinderGeometry(.48,.58,.36,48),new THREE.MeshPhysicalMaterial({color,metalness:.65,roughness:.18,clearcoat:1,emissive,emissiveIntensity:.3}));
 top.position.y=.25;top.castShadow=true;g.add(top);
 const cap=new THREE.Mesh(new THREE.CylinderGeometry(.25,.38,.2,48),new THREE.MeshStandardMaterial({color:0xf6fbff,metalness:.75,roughness:.18}));
 cap.position.y=.52;cap.castShadow=true;g.add(cap);
 return g;
}
const player={x:0,z:HALF-1.55,vx:0,vz:0,r:.72,tx:0,tz:HALF-1.55,mesh:makeMallet(0x2f9eff,0x146fd8)};
const ai={x:0,z:-HALF+1.55,vx:0,vz:0,r:.72,mesh:makeMallet(0xff5575,0xb91f45)};
scene.add(player.mesh,ai.mesh);

function sphere(r,color,metal=.05,rough=.55){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,28,20),new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough}));
 m.castShadow=true;return m;
}
function makeBear(){
 const root=new THREE.Group();
 const fur=0xf3b8c9, belly=0xffdfe8, dark=0x6e3f50, paw=0xff93b6;
 const body=sphere(.58,fur);body.scale.set(1,.95,1.05);body.position.y=.62;root.add(body);
 const bellyM=sphere(.34,belly);bellyM.scale.set(1,.35,.95);bellyM.position.set(0,.62,.5);root.add(bellyM);
 const head=sphere(.67,fur);head.position.y=1.52;root.add(head);
 const earL=sphere(.22,fur),earR=sphere(.22,fur);earL.position.set(-.45,2.0,0);earR.position.set(.45,2.0,0);root.add(earL,earR);
 const muzzle=sphere(.28,belly);muzzle.scale.set(1,.7,.75);muzzle.position.set(0,1.38,.52);root.add(muzzle);
 const nose=sphere(.09,dark);nose.position.set(0,1.48,.72);root.add(nose);
 const eyeL=sphere(.055,dark),eyeR=sphere(.055,dark);eyeL.position.set(-.22,1.68,.59);eyeR.position.set(.22,1.68,.59);root.add(eyeL,eyeR);
 const armL=sphere(.24,fur),armR=sphere(.24,fur);armL.scale.set(.7,1.55,.7);armR.scale.set(.7,1.55,.7);armL.position.set(-.64,.9,.05);armR.position.set(.64,.9,.05);armL.rotation.z=-.3;armR.rotation.z=.3;root.add(armL,armR);
 const legL=sphere(.28,fur),legR=sphere(.28,fur);legL.scale.set(.82,1.35,.9);legR.scale.set(.82,1.35,.9);legL.position.set(-.27,.08,.12);legR.position.set(.27,.08,.12);root.add(legL,legR);
 const handPadL=sphere(.11,paw),handPadR=sphere(.11,paw);handPadL.position.set(-.74,.5,.15);handPadR.position.set(.74,.5,.15);root.add(handPadL,handPadR);
 const footPadL=sphere(.12,paw),footPadR=sphere(.12,paw);footPadL.scale.set(1.1,.55,1);footPadR.scale.set(1.1,.55,1);footPadL.position.set(-.28,-.12,.35);footPadR.position.set(.28,-.12,.35);root.add(footPadL,footPadR);
 root.userData={body,head,earL,earR,muzzle,nose,eyeL,eyeR,armL,armR,legL,legR,handPadL,handPadR,footPadL,footPadR};
 return root;
}
const cheerBear=makeBear();cheerBear.scale.set(.72,.72,.72);cheerBear.position.set(5.55,.52,5.4);cheerBear.rotation.y=-.55;scene.add(cheerBear);
let skillBear=null,skillData=null;

const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-playY);
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
let dragging=false,skillArmed=false,skillReady=true,coolStart=0;
const skillCooldown=9000;
let pScore=0,aiScore=0,over=false,last=performance.now(),goalFlash=0;

function syncMeshes(){
 puckG.position.set(puck.x,.78,puck.z);
 player.mesh.position.set(player.x,.75,player.z);
 ai.mesh.position.set(ai.x,.75,ai.z);
}

function resetPuck(dir=1){
 puck.x=0;puck.z=0;puck.vx=(Math.random()-.5)*2.8;puck.vz=dir*(4.8+Math.random()*1.5);
 player.x=0;player.z=HALF-1.55;player.tx=0;player.tz=player.z;
 ai.x=0;ai.z=-HALF+1.55;syncMeshes();
}
function resetGame(){
 pScore=aiScore=0;over=false;message.textContent='';pScoreEl.textContent='0';aiScoreEl.textContent='0';
 if(skillBear){scene.remove(skillBear);skillBear=null;skillData=null}
 skillReady=true;skillArmed=false;bar.style.width='100%';skillBtn.disabled=false;skillBtn.textContent='皮皮熊技能';
 resetPuck(Math.random()>.5?1:-1);
}
resetBtn.addEventListener('click',resetGame);

function eventPoint(e){
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hit=new THREE.Vector3();
 return raycaster.ray.intersectPlane(groundPlane,hit)?hit:null;
}
renderer.domElement.addEventListener('pointerdown',e=>{
 const p=eventPoint(e);if(!p||over)return;
 if(skillArmed){
   const distGoal=Math.hypot(p.x,p.z-HALF);
   if(p.z>.35 && distGoal>2.15 && Math.abs(p.x)<TABLE_W/2-.8 && p.z<HALF-.8){
     if(skillBear)scene.remove(skillBear);
     skillBear=makeBear();skillBear.scale.set(.56,.56,.56);skillBear.position.set(p.x,.52,p.z);scene.add(skillBear);
     skillData={x:p.x,z:p.z,start:performance.now(),phase:0,angle:-Math.PI/2};
     skillArmed=false;skillReady=false;coolStart=performance.now();skillBtn.textContent='技能冷卻';
   }
   return;
 }
 dragging=true;renderer.domElement.setPointerCapture(e.pointerId);
 player.tx=THREE.MathUtils.clamp(p.x,-TABLE_W/2+.85,TABLE_W/2-.85);
 player.tz=THREE.MathUtils.clamp(p.z,.75,HALF-.9);
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;const p=eventPoint(e);if(!p)return;
 player.tx=THREE.MathUtils.clamp(p.x,-TABLE_W/2+.85,TABLE_W/2-.85);
 player.tz=THREE.MathUtils.clamp(p.z,.75,HALF-.9);
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
skillBtn.addEventListener('click',()=>{if(skillReady&&!over){skillArmed=!skillArmed;skillBtn.textContent=skillArmed?'點球場放置':'皮皮熊技能';}});

function collide(m,p,boost=1){
 let dx=p.x-m.x,dz=p.z-m.z,d=Math.hypot(dx,dz),min=m.r+p.r;if(d===0)d=.001;
 if(d<min){
  const nx=dx/d,nz=dz/d,ov=min-d;p.x+=nx*ov;p.z+=nz*ov;
  const rvx=p.vx-(m.vx||0),rvz=p.vz-(m.vz||0),rel=rvx*nx+rvz*nz;
  if(rel<0){p.vx-=1.9*rel*nx*boost;p.vz-=1.9*rel*nz*boost;p.vx+=(m.vx||0)*.28;p.vz+=(m.vz||0)*.28}
 }
}

function update(dt,now){
 if(over)return;
 const f=dt/16.67;
 const ox=player.x,oz=player.z;
 player.x+=(player.tx-player.x)*Math.min(1,.22*f);player.z+=(player.tz-player.z)*Math.min(1,.22*f);
 player.vx=(player.x-ox)/f;player.vz=(player.z-oz)/f;

 const aox=ai.x,aoz=ai.z;
 const targetX=puck.z<0?puck.x:0,targetZ=puck.z<0?Math.max(-HALF+.9,Math.min(-.9,puck.z-1.1)):-HALF+1.55;
 ai.x+=(targetX-ai.x)*Math.min(.12,.08*f);ai.z+=(targetZ-ai.z)*Math.min(.1,.065*f);
 ai.x=THREE.MathUtils.clamp(ai.x,-TABLE_W/2+.85,TABLE_W/2-.85);ai.z=THREE.MathUtils.clamp(ai.z,-HALF+.9,-.75);
 ai.vx=(ai.x-aox)/f;ai.vz=(ai.z-aoz)/f;

 puck.x+=puck.vx*f;puck.z+=puck.vz*f;puck.vx*=Math.pow(.9985,f);puck.vz*=Math.pow(.9985,f);

 const inGoal=Math.abs(puck.x)<GOAL_W/2-.08;
 if(puck.x-puck.r<-TABLE_W/2){puck.x=-TABLE_W/2+puck.r;puck.vx=Math.abs(puck.vx)}
 if(puck.x+puck.r> TABLE_W/2){puck.x= TABLE_W/2-puck.r;puck.vx=-Math.abs(puck.vx)}
 if(!inGoal&&puck.z-puck.r<-HALF){puck.z=-HALF+puck.r;puck.vz=Math.abs(puck.vz)}
 if(!inGoal&&puck.z+puck.r> HALF){puck.z= HALF-puck.r;puck.vz=-Math.abs(puck.vz)}

 collide(player,puck,1.08);collide(ai,puck,1.04);

 if(skillBear&&skillData){
   const age=now-skillData.start;skillData.phase=age/1000;
   if(age>5000){scene.remove(skillBear);skillBear=null;skillData=null}
   else{
     const stretch=1.0+1.7*(.5+.5*Math.sin(age*.007));
     const angle=-Math.PI/2+Math.sin(age*.0016)*.95;
     skillData.angle=angle;
     const u=skillBear.userData;
     u.body.scale.set(1,.95,stretch);
     u.body.position.z=(stretch-1)*.32;
     u.head.position.z=(stretch-1)*.62;
     u.earL.position.z=u.earR.position.z=u.head.position.z;
     u.muzzle.position.z=.52+(stretch-1)*.62;u.nose.position.z=.72+(stretch-1)*.62;
     u.eyeL.position.z=u.eyeR.position.z=.59+(stretch-1)*.62;
     skillBear.rotation.y=-angle+Math.PI/2;
     const tipX=skillData.x+Math.cos(angle)*(1.15*stretch),tipZ=skillData.z+Math.sin(angle)*(1.15*stretch);
     collide({x:tipX,z:tipZ,vx:Math.cos(angle)*2.5,vz:Math.sin(angle)*2.5,r:.55},puck,1.28);
   }
 }

 if(puck.z<-HALF-1 && inGoal){pScore++;pScoreEl.textContent=pScore;goal('PLAYER GOAL!');if(pScore>=5){end(true)}else resetPuck(1)}
 if(puck.z> HALF+1 && inGoal){aiScore++;aiScoreEl.textContent=aiScore;goal('AI GOAL');if(aiScore>=5){end(false)}else resetPuck(-1)}

 const sp=Math.hypot(puck.vx,puck.vz),max=15;if(sp>max){puck.vx=puck.vx/sp*max;puck.vz=puck.vz/sp*max}
 if(!skillReady){
   const q=Math.min(1,(now-coolStart)/skillCooldown);bar.style.width=(q*100)+'%';
   if(q>=1){skillReady=true;skillBtn.disabled=false;skillBtn.textContent='皮皮熊技能'}
   else skillBtn.disabled=true;
 }
 cheerBear.rotation.z=Math.sin(now*.003)*.035;cheerBear.position.y=.52+Math.sin(now*.0022)*.035;
 syncMeshes();
}
function goal(t){message.textContent=t;goalFlash=performance.now();setTimeout(()=>{if(!over)message.textContent=''},700)}
function end(win){over=true;message.textContent=win?'YOU WIN!':'AI WINS';}
function render(now){
 const dt=Math.min(32,now-last);last=now;update(dt,now);
 puckG.rotation.y+=Math.hypot(puck.vx,puck.vz)*.008;
 const flash=Math.max(0,1-(now-goalFlash)/500);rim.intensity=40+flash*80;
 renderer.render(scene,camera);requestAnimationFrame(render);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
resetGame();requestAnimationFrame(render);
</script>
</body>
</html>
